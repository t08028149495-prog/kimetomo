<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10101b"><title>ブロック管理 | キメ友SNS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><style>button,input,textarea,select{font-family:inherit}
:root{font-family:'Zen Maru Gothic',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#f4f1ff;background:#10101b;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10101b;min-height:100dvh}main{max-width:680px;margin:auto;padding:18px 15px 80px}a{color:#d7bbff}header{display:flex;align-items:center;gap:15px;margin-bottom:24px}h1{font-size:22px}p{line-height:1.65}.muted{color:#b7accb}.card{border:1px solid #57456f;background:#211b31;border-radius:16px;padding:18px;margin:12px 0}.item{display:flex;align-items:center;gap:12px;justify-content:space-between}.who{min-width:0;overflow-wrap:anywhere}.name{font-weight:700}.date{font-size:12px;color:#b7accb;margin-top:5px}button{border:1px solid #8665b1;background:#44335e;color:white;padding:11px 14px;border-radius:11px;font-size:15px;cursor:pointer}button:disabled{opacity:.5}.danger{background:#9d3859;border-color:#c05b7e}.notice{white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:20px;text-align:center;color:#b7accb}dialog{border:1px solid #8665b1;border-radius:18px;background:#211b31;color:#fff;max-width:calc(100vw - 32px);width:420px;padding:22px}dialog::backdrop{background:#000a}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
</style></head><body><main><header><a href="./?tab=profile">← 戻る</a><h1>ブロックしたユーザー</h1></header><p class="muted">ブロックした相手との新しいDM送信は双方とも制限されます。過去のDMは削除されません。</p><button id="refresh" type="button">一覧を更新</button><p id="status" class="notice" role="status" aria-live="polite"></p><div id="list"></div><dialog id="confirm"><h2>ブロックを解除しますか？</h2><p id="confirm-text"></p><p class="muted">相手があなたをブロックしている場合、解除してもDMの送信制限は続きます。</p><div class="actions"><button id="cancel" type="button">キャンセル</button><button id="accept" type="button" class="danger">解除する</button></div></dialog></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let db,me,pending=null;const status=msg=>$('status').textContent=msg;const shortId=id=>id.slice(0,8)+'…';
async function start(){try{const cfg=JSON.parse(localStorage.getItem('kimetomo_supabase')||'null');if(!cfg?.url||!cfg?.key)throw Error('接続設定がありません。トップページでログインしてください。');db=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await db.auth.getUser();if(error)throw error;if(!data.user)throw Error('ログインしてください。');me=data.user;await load();}catch(e){status('読み込みできません: '+e.message)}}
async function load(){if(!me)return;status('読み込み中…');$('list').replaceChildren();const {data,error}=await db.from('user_blocks').select('blocked_id,created_at').eq('blocker_id',me.id).order('created_at',{ascending:false});if(error){status('一覧を取得できません: '+error.message);return;}if(!data?.length){status('');const p=document.createElement('p');p.className='card empty';p.textContent='ブロックしたユーザーはいません。';$('list').append(p);return;}
// 名前は既存のプロフィール閲覧RLSが許す場合だけ取得。取得できなくても解除できる。
let names=new Map();const ids=data.map(x=>x.blocked_id);const {data:profiles,error:profileError}=await db.from('kimetomo_user_profiles').select('user_id,display_name').in('user_id',ids);if(!profileError)for(const p of profiles||[])names.set(p.user_id,p.display_name);
for(const row of data){const name=names.get(row.blocked_id)||'ユーザー '+shortId(row.blocked_id);const card=document.createElement('div');card.className='card item';const who=document.createElement('div');who.className='who';const title=document.createElement('div');title.className='name';title.textContent=name;const date=document.createElement('div');date.className='date';date.textContent='ブロック日時: '+new Date(row.created_at).toLocaleString('ja-JP');who.append(title,date);const btn=document.createElement('button');btn.type='button';btn.textContent='解除';btn.addEventListener('click',()=>{pending={id:row.blocked_id,name};$('confirm-text').textContent=name+' のブロックを解除します。';$('confirm').showModal();});card.append(who,btn);$('list').append(card);}status(data.length+'人をブロック中');}
$('cancel').onclick=()=>{$('confirm').close();pending=null};$('confirm').addEventListener('close',()=>{pending=null});$('accept').onclick=async()=>{if(!pending||!me)return;const target=pending;$('accept').disabled=true;try{const {data,error}=await db.from('user_blocks').delete().eq('blocker_id',me.id).eq('blocked_id',target.id).select('blocked_id');if(error)throw error;if(!data?.length)throw Error('解除対象が見つからないか、解除権限がありません。');$('confirm').close();await load();status(target.name+' のブロックを解除しました。');}catch(e){status('解除できません: '+e.message)}finally{$('accept').disabled=false;}};$('refresh').onclick=load;start();})();
</script></body></html>
