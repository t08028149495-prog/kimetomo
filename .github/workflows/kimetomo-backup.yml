name: Kimetomo encrypted backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: kimetomo-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Password fingerprint (temporary)
        shell: bash
        run: |
          fp=$(printf '%s' "$BACKUP_PASSWORD" | head -n1 | tr -d '\r\n' | sha256sum | cut -c1-6)
          len=$(printf '%s' "$BACKUP_PASSWORD" | head -n1 | tr -d '\r\n' | wc -m)
          echo "FINGERPRINT=$fp LENGTH=$len"

      - name: Prepare tools
        run: |
          python -m pip install requests
          mkdir -p backup

      - name: Export PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network host \
            -e SUPABASE_DB_URL \
            -v "$PWD/backup:/backup" \
            postgres:18 \
            sh -c 'pg_dump \
              --format=custom \
              --no-owner \
              --no-acl \
              --schema=public \
              --schema=auth \
              --schema=storage \
              --file=/backup/database.dump \
              "$SUPABASE_DB_URL"'

          test -s backup/database.dump

      - name: Export Storage objects
        run: |
          python scripts/backup_storage.py

      - name: Export source repository
        shell: bash
        run: |
          set -euo pipefail
          git bundle create backup/source.bundle --all
          git bundle verify backup/source.bundle
          test -s backup/source.bundle

      - name: Create encrypted archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf backup.tar.gz backup

          printf '%s' "$BACKUP_PASSWORD" | \
            openssl enc -aes-256-cbc \
              -salt -pbkdf2 -iter 200000 \
              -in backup.tar.gz \
              -out kimetomo-backup.tar.gz.enc \
              -pass stdin

          test -s kimetomo-backup.tar.gz.enc
          openssl enc -d -aes-256-cbc \
            -pbkdf2 -iter 200000 \
            -in kimetomo-backup.tar.gz.enc \
            -pass stdin \
            -out /dev/null <<< "$BACKUP_PASSWORD"

          sha256sum kimetomo-backup.tar.gz.enc \
            > kimetomo-backup.sha256

          rm -rf backup backup.tar.gz

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: kimetomo-full-backup
          path: |
            kimetomo-backup.tar.gz.enc
            kimetomo-backup.sha256
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
