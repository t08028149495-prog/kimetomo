<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>キメ友SNS | エフェクトの確認</title>
<!-- この端末でエフェクト（タップのきらめき・ページの切り替え）が出るかを調べるページ（2026-11-26）。
     ログイン不要。何も送らない・保存しない。画面に出た内容のスクリーンショットを送ってもらって原因を調べる。
     要らなくなったら、このファイルを消すだけでよい（ほかのページからは使っていない） -->
<script src="./js/lite.js"></script>
<style>
body{margin:0;padding:20px 16px 40px;background:#1b1016;color:#fff2f8;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;font-size:17px;line-height:1.6}
h1{font-size:20px;margin:0 0 4px;color:#ff9cc9}
p{margin:0 0 16px;color:#cea9ba;font-size:14px}
dl{margin:0}
dt{color:#cea9ba;font-size:13px;margin-top:14px}
dd{margin:2px 0 0;font-weight:700;word-break:break-all}
.ok{color:#9be8b0}.ng{color:#ffb38a}
small{display:block;font-weight:400;color:#cea9ba;font-size:13px}
</style></head><body>
<h1>エフェクトの確認</h1>
<p>この画面のスクリーンショットを送ってください。</p>
<!-- タブの切り替えと同じ動き（js/tabs.js の tabIn と同じ数字）を、このページだけで試す -->
<div style="border:1px solid #6f4557;border-radius:14px;padding:14px;margin:0 0 18px">
<div style="font-size:14px;color:#cea9ba;margin-bottom:10px">⓪ 下のボタンを押すと、四角の中身が切り替わります。<br>横から少し寄りながら、ふわっと出て見えますか？</div>
<div id="demo" style="background:#3a1d2c;border-radius:12px;padding:26px 14px;text-align:center;font-size:22px;font-weight:700">タイムライン</div>
<button id="demo-btn" type="button" style="margin-top:12px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff9cc9,#c9a2ff);color:#2a1220;font:inherit;font-weight:700">切り替えを試す</button>
</div>
<dl id="out"></dl>
<script>
(()=>{
// ⓪ のお試し：js/tabs.js の tabIn と同じ（透明のまま止めて、画面が 2 回描かれてから 0.26 秒で出す）
const demo=document.getElementById('demo'),names=['タイムライン','グループ','プロフィール'];let at=0;
document.getElementById('demo-btn').addEventListener('click',()=>{
  const dir=at===names.length-1?-1:1;at=(at+1)%names.length;demo.textContent=names[at];
  if(!demo.animate)return;
  const an=demo.animate([{opacity:0,transform:'translateX('+(dir*18)+'px)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.8,.3,1)',fill:'backwards'});
  an.pause();requestAnimationFrame(()=>requestAnimationFrame(()=>an.play()));
});
const out=document.getElementById('out'),mq=q=>!!(window.matchMedia&&matchMedia(q).matches);
const row=(label,value,good,note)=>{
  const dt=document.createElement('dt');dt.textContent=label;
  const dd=document.createElement('dd');dd.textContent=value;
  if(good!==undefined)dd.className=good?'ok':'ng';
  if(note){const s=document.createElement('small');s.textContent=note;dd.appendChild(s)}
  out.append(dt,dd);
};
const lite=document.documentElement.classList.contains('km-lite');
const still=mq('(prefers-reduced-motion: reduce)');
const vt=typeof document.startViewTransition==='function';
const vtPage=typeof CSSViewTransitionRule!=='undefined';
let saved='(なし)';try{saved=localStorage.getItem('km-lite')||'(なし)'}catch(e){saved='(読めない)'}
row('① 「視差効果を減らす」の設定',still?'オン':'オフ',!still,still?'オンの間は、きらめきも切り替えの動きも出しません':'');
row('② 軽量モード（遅い端末あつかい）',lite?'はい':'いいえ',!lite,lite?'きらめきは出ます。切り替えは「ふわっと出る」だけになります':'');
row('③ 新しい切り替えの動き',vt?'使える':'使えない',vt,vt?'':'切り替えは「ふわっと出る」だけになります');
row('④ ページをまたぐ切り替えの動き',vtPage?'使える':'使えない',vtPage);
row('メモリ（GB）',String(navigator.deviceMemory??'分からない'));
row('CPU のコア数',String(navigator.hardwareConcurrency??'分からない'));
row('覚えている測定結果',saved);
row('画面の大きさ',innerWidth+' × '+innerHeight+'（倍率 '+(window.devicePixelRatio||1)+'）');
row('端末・ブラウザ',navigator.userAgent);
})();
</script>
</body></html>
